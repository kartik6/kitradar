name: Nightly catalogue refresh

on:
  schedule:
    # 03:00 Asia/Kolkata (UTC+05:30). GitHub Actions schedules use UTC.
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      store:
        description: "Optional enabled store slug; leave blank to refresh every source"
        required: false
        type: string

permissions:
  contents: read

# Queue manual/nightly runs rather than cancelling a refresh halfway through an import.
concurrency:
  group: catalogue-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out catalogue worker
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify catalogue worker safety checks
        run: node --test scripts/refresh-catalogues.test.mjs

      - name: Refresh every enabled catalogue source
        env:
          KITRADAR_API_URL: ${{ secrets.KITRADAR_API_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          # Catalogue uploads can include hundreds of products and must outlive the short retailer-page timeout.
          KITRADAR_IMPORT_TIMEOUT_MS: 120000
          STORE: ${{ inputs.store }}
        shell: bash
        run: |
          set -euo pipefail
          : "${KITRADAR_API_URL:?Set the KITRADAR_API_URL GitHub Actions secret}"
          : "${ADMIN_TOKEN:?Set the ADMIN_TOKEN GitHub Actions secret}"
          node scripts/refresh-catalogues.mjs
